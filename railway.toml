[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'if [ -f /root/.hermes/scripts/container_init.py ]; then exec python /root/.hermes/scripts/container_init.py; else exec /entrypoint.sh; fi'"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
